<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GlobalTrotters — Loading</title>


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================== */

        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );

            color: white;
        }


        /* =========================
           LOADING PAGE
        ========================== */

        .loading-page {

            width: 100%;
            height: 100vh;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    rgba(79, 209, 197, 0.20),
                    transparent 38%
                ),

                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );
        }


        /* =========================
           DECORATIVE CIRCLES
        ========================== */

        .circle {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            pointer-events: none;
        }


        .circle.one {

            width: 500px;
            height: 500px;

            animation:
                rotate 20s linear infinite;
        }


        .circle.two {

            width: 750px;
            height: 750px;

            animation:
                rotateReverse 30s linear infinite;
        }


        .circle.three {

            width: 1000px;
            height: 1000px;

            animation:
                rotate 40s linear infinite;
        }


        /* =========================
           SMALL GLOWING DOTS
        ========================== */

        .glow {

            position: absolute;

            border-radius: 50%;

            background: #4fd1c5;

            filter: blur(1px);

            opacity: 0.35;

            box-shadow:
                0 0 30px
                rgba(79, 209, 197, 0.5);

            animation:
                pulse 3s ease-in-out infinite;
        }


        .glow.one {

            width: 7px;
            height: 7px;

            top: 25%;
            left: 24%;
        }


        .glow.two {

            width: 5px;
            height: 5px;

            top: 70%;
            left: 18%;

            animation-delay: 1s;
        }


        .glow.three {

            width: 6px;
            height: 6px;

            top: 30%;
            right: 20%;

            animation-delay: 1.5s;
        }


        .glow.four {

            width: 8px;
            height: 8px;

            bottom: 23%;
            right: 25%;

            animation-delay: 0.5s;
        }


        /* =========================
           MAIN CONTENT
        ========================== */

        .content {

            position: relative;

            z-index: 5;

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            animation:
                contentAppear 1s ease;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 15px;

            animation:
                fadeDown 1s ease;
        }


        .logo-icon {

            width: 58px;
            height: 58px;

            border-radius: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4fd1c5,
                    #319795
                );

            font-size: 28px;

            color: white;

            box-shadow:
                0 10px 35px
                rgba(79, 209, 197, 0.25);

            animation:
                iconPulse 2.5s ease-in-out infinite;
        }


        .logo-name {

            font-size: 42px;

            font-weight: 700;

            letter-spacing: -1.5px;

            color: white;
        }


        .logo-name span {

            color: #4fd1c5;
        }


        /* =========================
           TAGLINE
        ========================== */

        .tagline {

            color:
                rgba(255, 255, 255, 0.68);

            font-size: 14px;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 45px;

            animation:
                fadeUp 1s ease 0.2s both;
        }


        /* =========================
           LOADER
        ========================== */

        .loader {

            width: 270px;
            height: 5px;

            background:
                rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 15px;

            box-shadow:
                inset 0 0 8px
                rgba(0, 0, 0, 0.15);
        }


        .loader-bar {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #38b2ac,
                    #4fd1c5,
                    #81e6d9
                );

            box-shadow:
                0 0 12px
                rgba(79, 209, 197, 0.5);

            animation:
                loading 3.2s
                ease-in-out
                forwards;
        }


        /* =========================
           LOADING TEXT
        ========================== */

        .loading-text {

            color:
                rgba(255, 255, 255, 0.55);

            font-size: 13px;

            letter-spacing: 1px;

            animation:
                textFade 1.5s ease-in-out infinite;
        }


        /* =========================
           PLANE
        ========================== */

        .plane {

            position: absolute;

            font-size: 22px;

            color: #4fd1c5;

            animation:
                fly 4s ease-in-out infinite;

            opacity: 0.8;

            z-index: 3;

            text-shadow:
                0 0 15px
                rgba(79, 209, 197, 0.5);
        }


        .plane.one {

            top: 22%;
            left: 12%;
        }


        .plane.two {

            bottom: 23%;
            right: 14%;

            font-size: 17px;

            animation-delay: 1.5s;
        }


        /* =========================
           BOTTOM TEXT
        ========================== */

        .bottom-text {

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            color:
                rgba(255, 255, 255, 0.42);

            font-size: 11px;

            letter-spacing: 2px;

            z-index: 5;

            white-space: nowrap;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes loading {

            0% {
                width: 0%;
            }

            30% {
                width: 35%;
            }

            60% {
                width: 65%;
            }

            85% {
                width: 85%;
            }

            100% {
                width: 100%;
            }
        }


        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes contentAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes rotate {

            from {

                transform:
                    rotate(0deg);
            }

            to {

                transform:
                    rotate(360deg);
            }
        }


        @keyframes rotateReverse {

            from {

                transform:
                    rotate(360deg);
            }

            to {

                transform:
                    rotate(0deg);
            }
        }


        @keyframes fly {

            0% {

                transform:
                    translate(0, 0)
                    rotate(-10deg);
            }

            50% {

                transform:
                    translate(35px, -20px)
                    rotate(-5deg);
            }

            100% {

                transform:
                    translate(0, 0)
                    rotate(-10deg);
            }
        }


        @keyframes pulse {

            0%,
            100% {

                opacity: 0.25;

                transform:
                    scale(1);
            }

            50% {

                opacity: 0.7;

                transform:
                    scale(1.5);
            }
        }


        @keyframes iconPulse {

            0%,
            100% {

                transform:
                    scale(1);

                box-shadow:
                    0 10px 35px
                    rgba(79, 209, 197, 0.25);
            }

            50% {

                transform:
                    scale(1.04);

                box-shadow:
                    0 12px 45px
                    rgba(79, 209, 197, 0.4);
            }
        }


        @keyframes textFade {

            0%,
            100% {

                opacity: 0.5;
            }

            50% {

                opacity: 1;
            }
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .logo-name {

                font-size: 34px;
            }


            .logo-icon {

                width: 48px;
                height: 48px;

                font-size: 23px;

                border-radius: 15px;
            }


            .tagline {

                font-size: 10px;

                letter-spacing: 1.5px;

                margin-bottom: 35px;
            }


            .loader {

                width: 210px;
            }


            .circle.one {

                width: 350px;
                height: 350px;
            }


            .circle.two {

                width: 550px;
                height: 550px;
            }


            .circle.three {

                width: 750px;
                height: 750px;
            }


            .plane.one {

                left: 8%;
                top: 18%;
            }


            .plane.two {

                right: 8%;
                bottom: 18%;
            }


            .bottom-text {

                font-size: 9px;

                letter-spacing: 1.5px;
            }
        }


        @media (max-width: 400px) {

            .logo-name {

                font-size: 30px;
            }


            .logo-icon {

                width: 44px;
                height: 44px;

                font-size: 21px;
            }


            .tagline {

                font-size: 9px;
            }


            .loading-text {

                font-size: 11px;
            }
        }

    </style>

</head>


<body>


    <main class="loading-page">


        <!-- =========================
             DECORATIVE CIRCLES
        ========================== -->

        <div class="circle one"></div>

        <div class="circle two"></div>

        <div class="circle three"></div>


        <!-- =========================
             GLOWING DOTS
        ========================== -->

        <div class="glow one"></div>
        <div class="glow two"></div>
        <div class="glow three"></div>
        <div class="glow four"></div>


        <!-- =========================
             FLYING PLANES
        ========================== -->

        <div class="plane one">
            ✈
        </div>

        <div class="plane two">
            ✈
        </div>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <section class="content">


            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <div class="logo-name">
                    Global<span>Trotters</span>
                </div>

            </div>


            <p class="tagline">
                Your journey. Your way.
            </p>


            <div class="loader">

                <div class="loader-bar"></div>

            </div>


            <p class="loading-text">
                Preparing your journey...
            </p>


        </section>


        <!-- =========================
             BOTTOM TEXT
        ========================== -->

        <div class="bottom-text">
            PLAN • EXPLORE • TRAVEL
        </div>


    </main>


    <script>

        /*
         * GlobalTrotters Loading Screen
         *
         * The page automatically redirects
         * to index.html after 3.5 seconds.
         */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        window.location.href =
                            "index.html";

                    },
                    3500
                );

            }
        );

    </script>

</body>

</html>
