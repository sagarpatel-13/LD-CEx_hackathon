<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travio | Calendar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", sans-serif;
    min-height: 100vh;
    background: #f4f8f8;
    color: #24343b;
}

.navbar {
    height: 72px;
    background: white;
    border-bottom: 1px solid #e6eeee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 21px;
    font-weight: 700;
    color: #1f7774;
}

.brand-icon {
    width: 39px;
    height: 39px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #2db9a8, #247c78);
    color: white;
    box-shadow: 0 5px 15px rgba(45,185,168,0.25);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.nav-link {
    text-decoration: none;
    color: #66777d;
    font-size: 13px;
    font-weight: 500;
}

.nav-link:hover {
    color: #24988f;
}

.notification {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #f1f8f7;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #247c78;
    cursor: pointer;
}

.profile {
    width: 39px;
    height: 39px;
    border-radius: 50%;
    background: linear-gradient(135deg, #65d6c8, #247c78);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
}

.page {
    max-width: 1250px;
    margin: 0 auto;
    padding: 35px 30px 50px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title-area h1 {
    font-size: 30px;
    color: #20353b;
    margin-bottom: 5px;
}

.title-area p {
    font-size: 13px;
    color: #849398;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.action-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 17px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: 0.25s ease;
}

.today-btn {
    background: white;
    color: #317f7b;
    border: 1px solid #dce9e8;
}

.today-btn:hover {
    background: #eef9f7;
}

.plan-btn {
    background: linear-gradient(135deg, #32b7a7, #277e79);
    color: white;
    box-shadow: 0 7px 18px rgba(39,126,121,0.2);
}

.plan-btn:hover {
    transform: translateY(-2px);
}

.toolbar {
    background: white;
    border: 1px solid #e3eceb;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px rgba(31,66,70,0.04);
}

.search-box {
    position: relative;
    flex: 1;
}

.search-box i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #9aa9ad;
    font-size: 13px;
}

.search-box input {
    width: 100%;
    height: 40px;
    border: 1px solid #e0e9e8;
    border-radius: 9px;
    padding: 0 15px 0 38px;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    background: #fafcfc;
}

.search-box input:focus {
    border-color: #39aaa0;
    box-shadow: 0 0 0 3px rgba(57,170,160,0.08);
}

.select-box {
    position: relative;
}

.select-box select {
    height: 40px;
    min-width: 115px;
    border: 1px solid #e0e9e8;
    border-radius: 9px;
    padding: 0 28px 0 12px;
    background: #fafcfc;
    font-family: inherit;
    font-size: 11px;
    color: #53666b;
    outline: none;
    cursor: pointer;
}

.select-box select:focus {
    border-color: #39aaa0;
}

.calendar-card {
    background: white;
    border: 1px solid #e3eceb;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(31,66,70,0.05);
}

.calendar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.month-title {
    text-align: center;
}

.month-title h2 {
    font-size: 21px;
    color: #24383d;
    font-weight: 600;
}

.month-title span {
    display: block;
    font-size: 11px;
    color: #9aa6a9;
    margin-top: 3px;
}

.month-navigation {
    display: flex;
    gap: 8px;
}

.month-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid #e3eceb;
    background: #f9fcfc;
    color: #377f7b;
    cursor: pointer;
    transition: 0.2s;
}

.month-btn:hover {
    background: #e9f8f6;
    border-color: #bde2de;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid #e9eeee;
    border-left: 1px solid #e9eeee;
    overflow: hidden;
    border-radius: 10px 10px 0 0;
}

.weekday {
    min-height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fbfb;
    color: #879497;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    border-right: 1px solid #e9eeee;
    border-bottom: 1px solid #e9eeee;
}

.day {
    min-height: 105px;
    padding: 9px;
    border-right: 1px solid #e9eeee;
    border-bottom: 1px solid #e9eeee;
    background: white;
    position: relative;
    transition: 0.2s ease;
}

.day:hover {
    background: #fbfefe;
}

.day.other-month {
    background: #fafcfc;
    color: #c3cbcd;
}

.day-number {
    width: 27px;
    height: 27px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    font-size: 11px;
    color: #647579;
    margin-bottom: 5px;
}

.day.today .day-number {
    background: #2da99f;
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(45,169,159,0.25);
}

.day.weekend {
    background: #fcfdfd;
}

.event {
    padding: 5px 7px;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 9px;
    line-height: 1.3;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    transition: 0.2s ease;
}

.event:hover {
    transform: translateY(-1px);
    filter: brightness(0.98);
}

.event.trip {
    background: #dff6f2;
    color: #18786f;
    border-left: 3px solid #2da99f;
}

.event.flight {
    background: #e8efff;
    color: #4968a9;
    border-left: 3px solid #6788d5;
}

.event.hotel {
    background: #fff0dc;
    color: #a56824;
    border-left: 3px solid #e6a44f;
}

.event.activity {
    background: #f3e7ff;
    color: #8055a8;
    border-left: 3px solid #a76bd0;
}

.event.more {
    background: #f2f5f5;
    color: #768487;
    text-align: center;
    border-left: none;
}

.calendar-footer {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
    padding-top: 17px;
    border-top: 1px solid #edf1f1;
}

.legend-title {
    font-size: 11px;
    font-weight: 600;
    color: #647579;
}

.legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #7b898d;
}

.legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 3px;
}

.dot-trip {
    background: #2da99f;
}

.dot-flight {
    background: #6788d5;
}

.dot-hotel {
    background: #e6a44f;
}

.dot-activity {
    background: #a76bd0;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(21,43,47,0.55);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 500;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: 430px;
    max-width: 100%;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    animation: modalIn 0.25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-header h3 {
    font-size: 19px;
    color: #24383d;
}

.close-modal {
    width: 33px;
    height: 33px;
    border: none;
    border-radius: 9px;
    background: #f1f5f5;
    color: #748286;
    cursor: pointer;
}

.modal-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e0f5f2;
    color: #258b83;
    font-size: 20px;
    margin-bottom: 15px;
}

.modal-info {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.info-row {
    display: flex;
    align-items: center;
    gap: 11px;
    color: #647579;
    font-size: 12px;
}

.info-row i {
    width: 28px;
    color: #38a49b;
}

.modal-footer {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-btn {
    border: none;
    border-radius: 9px;
    padding: 9px 15px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
}

.close-btn {
    background: #edf3f3;
    color: #53666b;
}

.view-btn {
    background: #319e96;
    color: white;
}

.empty-message {
    grid-column: 1 / -1;
    padding: 60px 20px;
    text-align: center;
    color: #8c9a9d;
    font-size: 12px;
}

.empty-message i {
    display: block;
    font-size: 35px;
    margin-bottom: 12px;
    color: #b8d4d1;
}

@media (max-width: 900px) {

    .navbar {
        padding: 0 20px;
    }

    .nav-link {
        display: none;
    }

    .page {
        padding: 25px 15px;
    }

    .toolbar {
        flex-wrap: wrap;
    }

    .search-box {
        flex-basis: 100%;
    }

    .calendar-card {
        padding: 15px;
        overflow-x: auto;
    }

    .calendar-grid {
        min-width: 750px;
    }
}

@media (max-width: 600px) {

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .header-actions {
        width: 100%;
    }

    .action-btn {
        flex: 1;
        justify-content: center;
    }

    .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .search-box {
        grid-column: 1 / -1;
    }

    .select-box select {
        width: 100%;
    }

    .calendar-top {
        min-width: 750px;
    }

    .calendar-footer {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>

<body>

<header class="navbar">

<div class="brand">

<div class="brand-icon">
<i class="fa-solid fa-earth-americas"></i>
</div>

<span>Travio</span>

</div>

<div class="nav-right">

<a href="#" class="nav-link">Dashboard</a>

<a href="#" class="nav-link">My Trips</a>

<a href="#" class="nav-link">Explore</a>

<div class="notification">
<i class="fa-regular fa-bell"></i>
</div>

<div class="profile">
</div>

</div>

</header>

<main class="page">

<div class="page-header">

<div class="title-area">

<h1>Calendar View</h1>

<p>
Keep track of your trips, flights, hotels and activities.
</p>

</div>

<div class="header-actions">

<button class="action-btn today-btn" id="todayBtn">
<i class="fa-solid fa-calendar-day"></i>
Today
</button>

<button class="action-btn plan-btn">
<i class="fa-solid fa-plus"></i>
Plan New Trip
</button>

</div>

</div>

<div class="toolbar">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search trips, cities or activities...">

</div>

<div class="select-box">

<select id="groupSelect">

<option value="all">
Group By
</option>

Trip
</option>

<option value="type">
Type
</option>

</select>

</div>

<div class="select-box">

<select id="filterSelect">

<option value="all">
All Events
</option>

<option value="trip">
Trips
</option>

<option value="flight">
Flights
</option>

<option value="hotel">
Hotels
</option>

<option value="activity">
Activities
</option>

</select>

</div>

<div class="select-box">

<select id="sortSelect">

<option value="date">
Sort by Date
</option>

<option value="name">
Sort by Name
</option>

<option value="type">
Sort by Type
</option>

</select>

</div>

</div>

<section class="calendar-card">

<div class="calendar-top">

<div class="month-navigation">

<button
class="month-btn"
id="previousMonth">

</button>

</div>

<div class="month-title">

<h2 id="monthTitle"></h2>

</div>

<div class="month-navigation">

<button
class="month-btn"
id="nextMonth">

<i class="fa-solid fa-chevron-right"></i>

</button>

</div>

</div>

<div class="calendar-grid" id="calendarGrid"></div>

<div class="calendar-footer">

<span class="legend-title">
Event Types
</span>

<div class="legend-item">

<span class="legend-dot dot-trip"></span>

Trip

</div>

<div class="legend-item">

<span class="legend-dot dot-flight"></span>

Flight

<div class="legend-item">

<span class="legend-dot dot-hotel"></span>

Hotel

</div>

<div class="legend-item">

<span class="legend-dot dot-activity"></span>

Activity

</div>

</div>

</div>

</section>

</main>

<div class="modal-overlay" id="modalOverlay">

<div class="modal">

<div class="modal-header">

<h3 id="modalTitle">
Trip Details
</h3>

class="close-modal"
id="closeModal">

</button>

</div>

<div class="modal-icon" id="modalIcon">

<i class="fa-solid fa-plane"></i>

</div>

<div class="modal-info">

<div class="info-row">

<i class="fa-regular fa-calendar"></i>

<span id="modalDate"></span>

</div>

<div class="info-row">

<i class="fa-solid fa-location-dot"></i>

<span id="modalLocation"></span>

</div>

<div class="info-row">

<i class="fa-solid fa-tag"></i>

<span id="modalType"></span>

</div>

<div class="info-row">

<i class="fa-solid fa-suitcase"></i>

<span id="modalTrip"></span>

</div>

</div>

<div class="modal-footer">

<button
class="modal-btn close-btn"
id="modalCloseButton">

Close

</button>

<button
class="modal-btn view-btn">

View Trip

</button>

</div>

</div>

</div>

<script>

const events = [

{
date: "2026-08-05",
title: "Paris Trip",
location: "Paris, France",
type: "trip",
trip: "Europe Adventure"
},

{
date: "2026-08-06",
title: "Flight to Paris",
location: "Mumbai → Paris",
type: "flight",
trip: "Europe Adventure"
},

{
date: "2026-08-09",
title: "Paris City Tour",
location: "Eiffel Tower",
type: "activity",
trip: "Europe Adventure"
},

{
date: "2026-08-12",
title: "Hotel Check-in",
location: "Paris, France",
type: "hotel",
trip: "Europe Adventure"
},

{
date: "2026-08-15",
title: "New York Getaway",
location: "New York, USA",
type: "trip",
trip: "USA Getaway"
},

{
date: "2026-08-16",
title: "NYC Sightseeing",
location: "Manhattan, New York",
type: "activity",
trip: "USA Getaway"
},

{
date: "2026-08-20",
title: "Hotel Check-in",
location: "New York, USA",
type: "hotel",
trip: "USA Getaway"
},

{
date: "2026-08-23",
title: "Flight Home",
location: "New York → Mumbai",
type: "flight",
trip: "USA Getaway"
},

{
date: "2026-08-25",
title: "Tokyo Getaway",
location: "Tokyo, Japan",
type: "trip",
trip: "Japan Adventure"
},

{
date: "2026-08-27",
title: "Tokyo City Tour",
location: "Tokyo, Japan",
type: "activity",
trip: "Japan Adventure"
},

{
date: "2026-08-29",
title: "Tokyo Hotel",
location: "Tokyo, Japan",
type: "hotel",
trip: "Japan Adventure"
}

];

let currentDate = new Date();

let selectedEvent = null;

const calendarGrid =
document.getElementById("calendarGrid");

const monthTitle =
document.getElementById("monthTitle");

const eventCount =
document.getElementById("eventCount");

const searchInput =
document.getElementById("searchInput");

const filterSelect =
document.getElementById("filterSelect");

const sortSelect =
document.getElementById("sortSelect");

function getMonthName(month) {

return new Date(
2000,
month,
1
).toLocaleString(
"default",
{
month: "long"
}
);

}

function formatDate(dateString) {

const date =
new Date(dateString + "T00:00:00");

return date.toLocaleDateString(
"en-US",
{
weekday: "long",
year: "numeric",
month: "long",
day: "numeric"
}
);

}

function getFilteredEvents() {

let filtered =
[...events];

const search =
searchInput.value
.toLowerCase()
.trim();

const filter =
filterSelect.value;

if (search) {

filtered =
filtered.filter(event =>

event.title
.toLowerCase()
.includes(search)

||

event.location
.toLowerCase()
.includes(search)

||

event.trip
.toLowerCase()
.includes(search)

);

}

if (filter !== "all") {

filtered =
filtered.filter(
event => event.type === filter
);

}

const sort =
sortSelect.value;

if (sort === "date") {

filtered.sort(
(a,b) =>
new Date(a.date) -
new Date(b.date)
);

}

if (sort === "name") {

filtered.sort(
(a,b) =>
a.title.localeCompare(b.title)
);

}

if (sort === "type") {

filtered.sort(
(a,b) =>
a.type.localeCompare(b.type)
);

}

return filtered;

}

function renderCalendar() {

calendarGrid.innerHTML = "";

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

monthTitle.textContent =
`${getMonthName(month)} ${year}`;

const filteredEvents =
getFilteredEvents();

const monthEvents =
filteredEvents.filter(event => {

const date =
new Date(
event.date + "T00:00:00"
);

return date.getFullYear() === year
&&
date.getMonth() === month;

});

eventCount.textContent =
`${monthEvents.length} event${monthEvents.length !== 1 ? "s" : ""} this month`;

const weekdays = [
"Sun",
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat"
];

weekdays.forEach(day => {

const weekday =
document.createElement("div");

weekday.className =
"weekday";

weekday.textContent =
day;

calendarGrid.appendChild(
weekday
);

});

const firstDay =
new Date(
year,
month,
1
).getDay();

const daysInMonth =
new Date(
year,
month + 1,
0
).getDate();

const daysInPreviousMonth =
new Date(
year,
month,
0
).getDate();

const totalCells =
Math.ceil(
(firstDay + daysInMonth) / 7
) * 7;

const today =
new Date();

for (
let i = 0;
i < totalCells;
i++
) {

const day =
document.createElement("div");

day.className =
"day";

let dayNumber;

let actualDate;

if (i < firstDay) {

dayNumber =
daysInPreviousMonth -
firstDay +
i +
1;

actualDate =
new Date(
year,
month - 1,
dayNumber
);

day.classList.add(
"other-month"
);

} else if (
i >= firstDay + daysInMonth
) {

dayNumber =
i -
firstDay -
daysInMonth +
1;

actualDate =
new Date(
year,
month + 1,
dayNumber
);

day.classList.add(
"other-month"
);

} else {

dayNumber =
i -
firstDay +
1;

actualDate =
new Date(
year,
month,
dayNumber
);

}

if (
actualDate.getDay() === 0 ||
actualDate.getDay() === 6
) {

day.classList.add(
"weekend"
);

}

if (
actualDate.getDate() === today.getDate()
&&
actualDate.getMonth() === today.getMonth()
&&
actualDate.getFullYear() === today.getFullYear()
) {

day.classList.add(
"today"
);

}

const number =
document.createElement("div");

number.className =
"day-number";

number.textContent =
dayNumber;

day.appendChild(number);

const dateString =
`${actualDate.getFullYear()}-${String(actualDate.getMonth()+1).padStart(2,"0")}-${String(actualDate.getDate()).padStart(2,"0")}`;

const dayEvents =
filteredEvents.filter(
event =>
event.date === dateString
);

dayEvents
.slice(0,3)
.forEach(event => {

const eventElement =
document.createElement("div");

eventElement.className =
`event ${event.type}`;

eventElement.textContent =
event.title;

eventElement.addEventListener(
"click",
() =>
openModal(event)
);

day.appendChild(
eventElement
);

});

if (dayEvents.length > 3) {

const more =
document.createElement("div");

more.className =
"event more";

more.textContent =
`+${dayEvents.length - 3} more`;

day.appendChild(
more
);

}

calendarGrid.appendChild(
day
);

}

}

function openModal(event) {

selectedEvent =
event;

document.getElementById(
"modalTitle"
).textContent =
event.title;

document.getElementById(
"modalDate"
).textContent =
formatDate(event.date);

document.getElementById(
"modalLocation"
).textContent =
event.location;

document.getElementById(
"modalType"
).textContent =
event.type.charAt(0).toUpperCase()
+
event.type.slice(1);

document.getElementById(
"modalTrip"
).textContent =
event.trip;

const modalIcon =
document.getElementById(
"modalIcon"
);

const icons = {

trip:
"fa-solid fa-suitcase-rolling",

flight:
"fa-solid fa-plane",

hotel:
"fa-solid fa-hotel",

activity:
"fa-solid fa-camera"

};

modalIcon.innerHTML =
`<i class="${icons[event.type]}"></i>`;

document
.getElementById("modalOverlay")
.classList.add("active");

}

function closeModal() {

document
.getElementById("modalOverlay")
.classList.remove("active");

}

document
.getElementById("previousMonth")
.addEventListener(
"click",
function() {

currentDate.setMonth(
currentDate.getMonth() - 1
);

renderCalendar();

}
);

document
.getElementById("nextMonth")
.addEventListener(
"click",
function() {

currentDate.setMonth(
currentDate.getMonth() + 1
);

renderCalendar();

}
);

document
.getElementById("todayBtn")
.addEventListener(
"click",
function() {

currentDate =
new Date();

renderCalendar();

}
);

searchInput.addEventListener(
"input",
renderCalendar
);

filterSelect.addEventListener(
"change",
renderCalendar
);

sortSelect.addEventListener(
"change",
renderCalendar
);

document
.getElementById("closeModal")
.addEventListener(
"click",
closeModal
);

document
.getElementById("modalCloseButton")
.addEventListener(
"click",
closeModal
);

document
.getElementById("modalOverlay")
.addEventListener(
"click",
function(event) {

if (
event.target ===
this
) {

closeModal();

}

}
);

document.addEventListener(
"keydown",
function(event) {

if (
event.key === "Escape"
) {

closeModal();

}

}
);

renderCalendar();

</script>

</body>

</html>
